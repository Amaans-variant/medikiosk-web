<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#334155" stroke-width="8" opacity="0.6" />

  <!-- Outer Glowing Medical Cross Aura -->
  <g filter="url(#glow)">
    <path d="M 216 112 H 296 V 216 H 400 V 296 H 296 V 400 H 216 V 296 H 112 V 216 H 216 Z" fill="url(#crossGradient)" opacity="0.9" />
  </g>

  <!-- Inner Dynamic Stethoscope / Vital Heartbeat Pulse line -->
  <path d="M 128 256 H 192 L 216 192 L 248 320 L 280 224 L 304 272 L 320 256 H 384" 
        fill="none" 
        stroke="url(#pulseGradient)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Kiosk Intelligent Sparkle / Dot Emblem -->
  <circle cx="368" cy="144" r="28" fill="#38bdf8" />
  <circle cx="368" cy="144" r="14" fill="#ffffff" />
</svg>
